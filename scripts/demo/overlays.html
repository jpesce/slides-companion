<!doctype html>
<!-- What edit.mjs lays over the recording, drawn one at a time by draw() and saved as PNGs. Material 3
     as Google's own apps use it: Google Sans, the light surface around windows, the elevation shadow,
     the snackbar for what's pressed, and the deck's own colours on the cards. -->
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500&display=block" rel="stylesheet" />
<style>
  :root {
    --surface: #f8fafd; /* Google's app background, as in Drive and Gmail */
    --on-surface: #1f1f1f;
    --on-surface-variant: #444746;
    --primary-container: #d3e3fd;
    --on-primary-container: #041e49;
    --inverse-surface: #303030;
    --inverse-on-surface: #f2f2f2;
  }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
  body { font-family: 'Google Sans', sans-serif; -webkit-font-smoothing: antialiased; }
  .window { position: absolute; border-radius: 16px; background: #fff;
    /* Material elevation level 3 */
    box-shadow: 0 1px 3px 0 rgb(0 0 0 / 0.3), 0 4px 8px 3px rgb(0 0 0 / 0.15); }
  .mask { position: absolute; border-radius: 16px; background: #fff; }
  .snackbar { position: absolute; left: 50%; top: 32px; transform: translateX(-50%);
    display: flex; align-items: center; gap: 20px; white-space: nowrap;
    padding: 18px 36px; border-radius: 8px; background: var(--inverse-surface); color: var(--inverse-on-surface);
    font-size: 32px; line-height: 40px; letter-spacing: 0.01em;
    box-shadow: 0 1px 3px 0 rgb(0 0 0 / 0.3), 0 4px 8px 3px rgb(0 0 0 / 0.15); }
  .keys { display: flex; align-items: center; gap: 10px; }
  .key { min-width: 36px; padding: 2px 12px; border-radius: 6px; text-align: center; font-weight: 500;
    background: rgb(255 255 255 / 0.12); box-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.32); }
  /* Chrome's picture-in-picture window on macOS, measured in points and scaled with the window
     (job.window.bar is the title bar's height): a dark bar with Back to Tab, the site, and Close. */
  .pip { position: absolute; border-radius: 10px; background: #212122; overflow: hidden;
    box-shadow: 0 2px 6px 0 rgb(0 0 0 / 0.3), 0 8px 24px 6px rgb(0 0 0 / 0.2); }
  .pip-bar { position: absolute; left: 0; right: 0; top: 0; display: flex; align-items: center; justify-content: space-between;
    padding: 0 calc(var(--pt) * 7); font-family: system-ui, -apple-system, sans-serif; font-weight: 500;
    font-size: calc(var(--pt) * 13); color: #e3e3e3; }
  .pip-button { display: flex; white-space: nowrap; align-items: center; gap: calc(var(--pt) * 6); height: calc(var(--pt) * 27);
    padding: 0 calc(var(--pt) * 10); border-radius: calc(var(--pt) * 7); background: #373738; }
  .pip-site { display: flex; align-items: center; gap: calc(var(--pt) * 8); }
  .pip svg { width: calc(var(--pt) * 14); height: calc(var(--pt) * 14); }
  .card { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: var(--primary-container); color: var(--on-primary-container); text-align: center; }
  .card h1 { margin: 0; font-weight: 400; font-size: 112px; line-height: 1.15; letter-spacing: -0.01em; }
  .card p { margin: 28px 0 0; font-size: 44px; line-height: 1.3; }
</style>
<body></body>
<script>
  const px = (n) => `${n}px`;
  const place = (el, { x, y, width, height }) =>
    Object.assign(el.style, { left: px(x), top: px(y), width: px(width), height: px(height) });

  const key = (name) => {
    const el = document.createElement('span');
    el.className = 'key';
    el.textContent = name;
    return el;
  };

  window.draw = (job) => {
    document.body.replaceChildren();
    document.documentElement.style.background = 'transparent';
    if (job.kind === 'background') {
      document.documentElement.style.background = 'var(--surface)';
      for (const w of job.windows) {
        const el = document.createElement('div');
        el.className = 'window';
        place(el, w);
        document.body.append(el);
      }
    } else if (job.kind === 'mask') {
      document.documentElement.style.background = '#000';
      const el = document.createElement('div');
      el.className = 'mask';
      place(el, job.window);
      // Under a title bar, only the bottom corners are round.
      if (job.window.bar) el.style.borderRadius = '0 0 10px 10px';
      document.body.append(el);
    } else if (job.kind === 'pip') {
      const { x, y, width, height, bar } = job.window;
      const frame = document.createElement('div');
      frame.className = 'pip';
      place(frame, { x, y: y - bar, width, height: height + bar });
      frame.style.setProperty('--pt', `${bar / 46}px`);
      const strip = document.createElement('div');
      strip.className = 'pip-bar';
      strip.style.height = px(bar);
      // Drawn as lines, as Chrome's icons are: an arrow up and to the left, and a cross.
      const icon = (d) => {
        const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        svg.setAttribute('viewBox', '0 0 24 24');
        const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        Object.entries({ d, fill: 'none', stroke: 'currentColor', 'stroke-width': '2', 'stroke-linecap': 'round', 'stroke-linejoin': 'round' })
          .forEach(([k, v]) => p.setAttribute(k, v));
        svg.append(p);
        return svg;
      };
      const button = (d, words) => {
        const el = document.createElement('div');
        el.className = 'pip-button';
        el.append(icon(d), words);
        return el;
      };
      const back = button('M18 18 6 6M6 16V6h10', 'Back to Tab');
      const site = document.createElement('div');
      site.className = 'pip-site';
      const favicon = document.createElement('img');
      favicon.src = 'https://ssl.gstatic.com/docs/presentations/images/favicon-2023q4.ico';
      favicon.style.cssText = `width: ${bar * 0.4}px; height: ${bar * 0.4}px;`;
      site.append(favicon, 'docs.google.com');
      const close = button('M6 6l12 12M18 6 6 18', 'Close');
      strip.append(back, site, close);
      frame.append(strip);
      document.body.append(frame);
    } else if (job.kind === 'caption') {
      const bar = document.createElement('div');
      bar.className = 'snackbar';
      // Keys go where the words name them: "Press {Space}" shows Space as a key.
      const line = document.createElement('div');
      line.className = 'keys';
      for (const name of job.caption.keys ?? []) line.append(key(name));
      job.caption.text.split(/(\{[^}]+\})/).forEach((piece) => {
        if (/^\{.+\}$/.test(piece)) line.append(key(piece.slice(1, -1)));
        else if (piece.trim()) line.append(piece.trim());
      });
      bar.append(line);
      document.body.append(bar);
    } else if (job.kind === 'card') {
      const card = document.createElement('div');
      card.className = 'card';
      const title = document.createElement('h1');
      title.textContent = job.title;
      card.append(title);
      if (job.subtitle) {
        const line = document.createElement('p');
        line.textContent = job.subtitle;
        card.append(line);
      }
      document.body.append(card);
    }
  };
</script>
