<!doctype html>
<!-- What shows over the slide instead of a site that refuses to be shown inside another page,
     framed onto the Spotlight stage by spotlight.js: Chrome asks for every site only from the
     extension's own pages. Its language and the site's name are in its address
     (?hl=pt-BR&site=google.com). -->
<html>
  <head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="fonts.css">
    <link rel="stylesheet" href="refused.css">
  </head>
  <body>
    <main class="slides-companion-refused">
      <!-- Material Symbols' web_asset_off: a page, crossed out. -->
      <svg class="slides-companion-refused-icon" viewBox="0 -960 960 960" aria-hidden="true"><path d="M818-28 686-160H160q-33 0-56.5-23.5T80-240v-480q0-33 23.5-56.5T160-800v114L26-820l57-57L875-85l-57 57ZM160-240h446L206-640h-46v400Zm711 37-71-71v-366H434L274-800h526q33 0 56.5 23.5T880-720v480q0 10-2 19.5t-7 17.5Z"/></svg>
      <h1 class="slides-companion-refused-title"></h1>
      <p class="slides-companion-refused-text"></p>
      <div class="slides-companion-refused-actions">
        <button type="button" class="slides-companion-refused-button slides-companion-refused-open"></button>
        <button type="button" class="slides-companion-refused-button slides-companion-refused-allow"></button>
      </div>
    </main>
    <script src="messages.js"></script>
    <script src="i18n.js"></script>
    <script src="refused.js"></script>
  </body>
</html>
